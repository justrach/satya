[package]
name = "satya"
version = "0.4.12"
edition = "2021"
authors = ["Rach Pradhan"]
description = "THE FASTEST Python validation library - 1.90× faster than Pydantic, 100% API compatible"
repository = "https://github.com/rachpradhan/satya"
license = "Apache-2.0"

[lib]
name = "_satya"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26.0", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.9.1"
once_cell = "1.21"
rayon = "1.11"
# SIMD-accelerated string searching (2-10x faster than naive)
memchr = "2.7"
# Multi-pattern matching with Aho-Corasick (for email TLD validation)
aho-corasick = "1.1"
# Arena allocator for batch operations (reduces allocation overhead)
bumpalo = "3.16"
# Faster hashing for small keys
ahash = "0.8"
# Compact string storage
compact_str = "0.8"
# Small vector optimization
smallvec = "1.13"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort" 
